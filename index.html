<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Work out when a legal notice must reach a county's official newspaper to be published by a court deadline. Georgia." />
  <title>Publication Deadline Calculator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232c6e49'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23f6f1e7' font-family='Georgia,serif' font-weight='700'%3EP%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app" x-data="app" x-cloak>
    <header class="masthead">
      <h1>Priscilla's Amazing Publication Deadline Calculator</h1>
      <a class="source-link" href="https://github.com/Ananym/deadlines">Source</a>
    </header>

    <section class="controls">
      <div class="control" x-show="data.length > 1">
        <div class="control-label">State</div>
        <div class="segmented" role="radiogroup" aria-label="State">
          <template x-for="(state, i) in data" :key="state.name">
            <button type="button" role="radio" :aria-checked="stateIndex === i" :class="{ active: stateIndex === i }" @click="selectState(i)" x-text="state.name"></button>
          </template>
        </div>
      </div>

      <div class="control" x-show="saleModeAvailable">
        <div class="control-label">Notice</div>
        <div class="segmented" role="radiogroup" aria-label="Notice type">
          <button type="button" role="radio" :aria-checked="mode === 'publish'" :class="{ active: mode === 'publish' }" @click="mode = 'publish'">Publish by date</button>
          <button type="button" role="radio" :aria-checked="mode === 'sale'" :class="{ active: mode === 'sale' }" @click="mode = 'sale'">Foreclosure sale</button>
        </div>
      </div>

      <div class="control control-counties" @click.outside="open = false" @keydown.escape="open = false">
        <label class="control-label" for="county-search">Counties</label>
        <div class="picker" :class="{ open }">
          <div class="picker-field" @click="$refs.search.focus()">
            <template x-for="name in selected" :key="state.name + ':' + name">
              <button type="button" class="chip" @click.stop="toggle(name)" :aria-label="`Remove ${name}`">
                <span x-text="name"></span><span aria-hidden="true">×</span>
              </button>
            </template>
            <input id="county-search" x-ref="search" type="text" :placeholder="selected.length ? 'Add another…' : 'Search counties…'"
              x-model="query" autocomplete="off" @focus="open = true" @keydown.enter.prevent="pickFirst()" @keydown.backspace="if (!query) popLast()" />
          </div>
          <div class="picker-menu" x-show="open" role="listbox" aria-multiselectable="true">
            <template x-for="c in filteredCounties" :key="state.name + ':' + c.name">
              <label class="county-option" :class="{ checked: isSelected(c.name) }">
                <input type="checkbox" :checked="isSelected(c.name)" @change="toggle(c.name)" />
                <span class="county-name" x-text="c.name"></span>
                <span class="county-days" x-text="dayShort(c)"></span>
              </label>
            </template>
            <p class="muted small" x-show="filteredCounties.length === 0">No counties match.</p>
          </div>
        </div>
      </div>

      <div class="control control-date">
        <label class="control-label" for="court-date" x-text="isSale ? 'Sale date' : 'Must be published by'"></label>
        <input id="court-date" type="date" x-model="courtDate" />
        <p class="hint" x-show="isSale">
          <template x-if="court && !isFirstTuesday(court)"><span class="caution-text">Not a first Tuesday. </span></template>
          <button type="button" class="link" @click="setNextSale()" x-text="`Next sale: ${fmt(nextSale())}`"></button>
        </p>
      </div>
    </section>

    <main class="results">
      <p class="empty" x-show="!results.length" x-text="!selected.length ? 'Pick one or more counties to begin.' : (courtDate ? '' : 'Choose the date the notice must have appeared in print.')"></p>

      <template x-if="results.length">
        <div>
          <p class="results-heading">
            <template x-if="isSale"><span>Send the notice to each paper by the date shown so it runs weekly for the four weeks before the sale on <strong x-text="fmtLong(court)"></strong>.</span></template>
            <template x-if="!isSale"><span>Send the notice to each paper by the date shown, for publication on or before <strong x-text="fmtLong(court)"></strong>.</span></template>
            <span class="holiday-summary" x-show="holidayCount">
              <span class="pill holiday">Bank holiday</span>
              <span x-text="holidayCount === 1 ? '1 deadline moved earlier.' : `${holidayCount} deadlines moved earlier.`"></span>
            </span>
          </p>
          <ol class="cards">
            <template x-for="r in results" :key="state.name + ':' + r.county.name">
              <li class="card" :class="{ past: r.daysLeft < 0, holiday: r.holiday }">
                <div class="card-head">
                  <h2 x-text="r.county.name"></h2>
                  <span class="pill holiday" x-show="r.holiday" x-text="r.holiday"></span>
                  <span class="pill weekend" x-show="!r.holiday && r.calc.deadline.adjusted">Weekend</span>
                  <span class="pill past" x-show="r.daysLeft < 0">Past</span>
                </div>
                <div class="deadline">
                  <span class="deadline-date" x-text="fmt(r.calc.deadline.date)"></span>
                  <span class="deadline-time" x-text="r.calc.deadline.time"></span>
                </div>
                <p class="adjust" x-show="r.calc.deadline.adjusted">
                  <span x-text="fmt(r.calc.deadline.nominal)"></span> is <span x-text="adjustReason(r.calc.deadline)"></span>, so the deadline moves back to <span x-text="dayName(r.calc.deadline.date)"></span>.
                </p>
                <p class="meta">
                  <template x-if="isSale"><span>Runs <span x-text="fmt(r.calc.firstPublication)"></span> to <span x-text="fmt(r.calc.lastPublication)"></span></span></template>
                  <template x-if="!isSale"><span>Publishes <span x-text="fmt(r.calc.publicationDate)"></span></span></template>
                  · <span x-text="r.calc.rule.daysPrior"></span> days prior
                  <template x-if="r.calc.lateDeadline">
                    <span> · late deadline <span x-text="fmt(r.calc.lateDeadline.date)"></span>, <span x-text="r.calc.lateDeadline.time"></span><span x-show="r.calc.lateDeadline.adjusted"> (moved from <span x-text="fmt(r.calc.lateDeadline.nominal)"></span>)</span></span>
                  </template>
                </p>
                <p class="meta caution-text" x-show="pubHolidayNote(r.calc)" x-text="pubHolidayNote(r.calc)"></p>
                <details class="cautions" x-show="cautions(r.county).length">
                  <summary x-text="cautions(r.county).length === 1 ? 'Data caution' : `${cautions(r.county).length} data cautions`"></summary>
                  <ul>
                    <template x-for="(n, i) in cautions(r.county)" :key="i"><li x-text="n"></li></template>
                  </ul>
                </details>
              </li>
            </template>
          </ol>
        </div>
      </template>
    </main>
  </div>
  <noscript>This calculator needs JavaScript.</noscript>
</body>
</html>
